<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="曹智锦 · AI应用工程师 / 智慧养老产品运营 / 数据分析实习生 - 个人简历">
<meta name="theme-color" content="#0a0e1a">
<meta name="format-detection" content="telephone=no">
<title>曹智锦 · 个人简历</title>
<!--
  3D 地球依赖（CDN 引入，jsDelivr 国内镜像）：
  - Three.js r128: https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js
  - OrbitControls r128: https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js
  所有渲染逻辑写在 script.js，本 HTML 仅作 CDN 引用。
-->
<script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 紫蓝渐变光晕背景层 -->
<div class="bg-glow" aria-hidden="true">
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>
  <div class="bg-blob bg-blob-3"></div>
  <div class="bg-grid"></div>
</div>

<header class="nav">
  <div class="nav-inner">
    <div class="brand">
      <div class="logo">曹</div>
      <div class="name">CAO.ZHIJIN</div>
    </div>
    <nav class="nav-links" id="navLinks" aria-label="主导航">
      <a href="#hero">首页</a>
      <a href="#about">关于</a>
      <a href="#skills">技能</a>
      <a href="#projects">项目</a>
      <a href="#timeline">经历</a>
      <a href="#contact">联系</a>
    </nav>
    <div class="nav-actions">
      <button class="icon-btn" id="menuBtn" aria-label="菜单" aria-expanded="false" aria-controls="navLinks">
        <svg id="iconMenu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        <svg id="iconClose" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>
</header>

<main>
  <section id="hero" class="reveal"></section>
  <section id="about" class="reveal"></section>
  <section id="skills" class="reveal"></section>
  <section id="projects" class="reveal"></section>
  <section id="timeline" class="reveal"></section>
  <section id="contact" class="reveal"></section>
</main>

<button class="to-top" id="toTop" aria-label="返回顶部">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
</button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="证书大图">
  <button class="lb-close" id="lbClose" aria-label="关闭">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <img id="lbImg" src="" alt="" decoding="async">
  <div class="lb-cap" id="lbCap"></div>
</div>

<script defer src="script.js"></script>
</body>
</html>
